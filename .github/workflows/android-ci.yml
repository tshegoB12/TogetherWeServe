name: TogetherWeServe CI

on:
  push:
    branches: ["main", "master"]
    tags: ["final-poe", "v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  android:
    name: Unit tests + build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # google-services.json is committed (client config). If you prefer to keep
      # it out of git, add a repo secret GOOGLE_SERVICES_JSON and it will be used.
      - name: Provide google-services.json from secret (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "Using google-services.json from repository secret"
          fi
          test -f app/google-services.json || { echo "::error::app/google-services.json missing"; exit 1; }

      - name: Grant Gradle permission
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build release APK (unsigned unless keystore is provided)
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: togetherweserve-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
